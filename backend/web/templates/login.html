{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto my-12 bg-white p-8 rounded-lg shadow-lg">
    <div class="text-center mb-6">
        <h2 class="text-3xl font-extrabold text-gray-900">SDMS LOGIN</h2>
        <p class="text-sm text-gray-500 mt-2">Ministry of Home Affairs</p>
    </div>
    {% if error %}
    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
        <span class="block sm:inline">{{ error }}</span>
    </div>
    {% endif %}
    <form method="POST" action="{% url 'web_login' %}" class="space-y-6">
        {% csrf_token %}
        <div>
            <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
            <input type="text" name="username" id="username" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50 p-2.5 bg-gray-50 border">
        </div>
        <div>
            <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
            <input type="password" name="password" id="password" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50 p-2.5 bg-gray-50 border">
        </div>
        <div>
            <button type="submit" class="w-full py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-900 hover:bg-blue-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-150">Sign In</button>
        </div>
    </form>
</div>
{% endblock %}
