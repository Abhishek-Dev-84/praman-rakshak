services:
  db:
    image: postgres:16-alpine
    container_name: sdms_postgres
    restart: always
    environment:
      POSTGRES_DB: sdms_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sdms_redis
    restart: always
    ports:
      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sdms_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-sdms-production-super-secret-key-change-in-prod}
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres123}@db:5432/sdms_db
      AUDIT_CHAIN_SECRET: ${AUDIT_CHAIN_SECRET:-audit-hmac-sha256-chain-secret}
      PRIVATE_KEY_ENCRYPTION_SALT: ${PRIVATE_KEY_ENCRYPTION_SALT:-private-key-salt-production}
      ALLOWED_HOSTS: "*"
      CORS_ALLOW_ALL_ORIGINS: "True"
    volumes:
      - media_volume:/app/media

volumes:
  postgres_data:
  media_volume:
