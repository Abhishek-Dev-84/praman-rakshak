databases:
  - name: sdms-postgres
    plan: free
    databaseName: sdms_db
    user: sdms_user

services:
  - type: web
    name: praman-rakshak-backend
    runtime: python
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt && cd frontend && npm install && npm run build && cd .. && python manage.py collectstatic --noinput && python manage.py migrate --noinput"
    startCommand: "cd backend && daphne -b 0.0.0.0 -p $PORT config.asgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.11.0
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sdms-postgres
          property: connectionString
      - key: AUDIT_CHAIN_SECRET
        generateValue: true
      - key: PRIVATE_KEY_ENCRYPTION_SALT
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
